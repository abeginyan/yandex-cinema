apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cinemaabyss-ingress
  namespace: cinemaabyss
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: cinemaabyss.example.com
      http:
        paths:
          # Events microservice — /api/events, /api/events/movie,
          # /api/events/user, /api/events/health (events-service:8082).
          # Listed first so this more specific prefix wins over "/".
          - path: /api/events
            pathType: Prefix
            backend:
              service:
                name: events-service
                port:
                  number: 8082
          # Proxy service (strangler-fig gateway) — catch-all entry point.
          # Handles /health and forwards the rest to the right upstream:
          #   /api/movies, /api/movies/health -> movies-service:8091 (or monolith)
          #   /api/users, /api/payments, /api/subscriptions -> monolith:8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: proxy-service
                port:
                  number: 8000
